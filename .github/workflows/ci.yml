name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job here runs on a self-hosted runner — a Mac mini on a desk, not a
# disposable VM. On a public repository a pull request from a fork would
# therefore be arbitrary code execution on that machine, and the `Stage ROM`
# step below puts a cartridge dump into the workspace where a malicious PR
# could read it back out.
#
# So the self-hosted jobs run only for pull requests raised from a branch in
# this repository. A fork PR skips them and reports no CI rather than running
# untrusted code; whoever reviews it can re-run the workflow by hand from a
# local branch. GitHub's own guidance is not to use self-hosted runners on
# public repositories at all, and the Settings toggle requiring approval for
# outside contributors is worth having as well — but a setting can be changed
# back by accident and this cannot.
jobs:
  package:
    name: Build and test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Swift and the Apple SDKs are needed, so this must run on the macOS
    # self-hosted runner rather than the Linux one.
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      # The test suite builds synthetic iNES images in memory and needs no real
      # ROM, so it runs on a clean checkout. Tests that do require the ROM
      # (decompiled routine equivalence) skip themselves when it is absent.
      - name: Test
        run: swift test

      - name: Build release
        run: swift build -c release

      # Exercises the emulator end to end without a ROM: verifies the CLI is
      # wired up and the analyzer runs.
      - name: Smoke test CLI
        run: |
          swift run -c release nesrun 2>&1 | head -5 || true

  lint:
    name: Format check
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4

      - name: Ensure swiftformat
        run: |
          if ! command -v swiftformat >/dev/null 2>&1; then
            brew install swiftformat
          fi
          # Printed so a lint failure caused by a tool upgrade introducing new
          # rules is obvious from the log rather than looking like a code
          # regression — which is exactly what happened the first time this ran.
          echo "swiftformat $(swiftformat --version)"

      - name: Lint
        run: swiftformat Sources Tests --lint --cache ignore

  app:
    name: Build iOS app
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4

      # ROMs are never committed. The app target uses a file-system
      # synchronized group, so a missing ROM does not break the build — the
      # app just reports it at launch. If the runner has a local copy, use it.
      - name: Stage ROM if available
        run: |
          if [ -f "$HOME/roms/zelda.nes" ]; then
            cp "$HOME/roms/zelda.nes" Apps/ZeldaiOS/zelda.nes
            echo "Staged ROM from runner."
          else
            echo "No ROM on runner; building without the bundled resource."
          fi

      - name: Build for simulator
        run: |
          xcodebuild -project Apps/ZeldaiOS.xcodeproj \
            -scheme Zelda \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
